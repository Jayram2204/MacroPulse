[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "macro-pulse"
version = "0.1.0"
description = "Macro event impact analysis toolkit for equities and ETFs"
requires-python = ">=3.10"
dependencies = [
    "yfinance>=0.2.36",
    "fredapi>=0.5.1",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
    "fastapi>=0.108.0",
    "uvicorn>=0.25.0",
    "streamlit>=1.30.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.2.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
